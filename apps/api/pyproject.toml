[project]
name = "relay-api"
version = "0.1.0"
description = "Knowledge-base chat assistant for websites: API, indexing worker and Telegram handoff bot"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.149",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16",
    "redis>=5",
    "saq[redis]>=0.26",
    "openai>=3.35",
    "httpx>=0.28",
    "trafilatura>=2.3",
    "pypdf>=6.21",
    "python-docx>=1.2",
    "pwdlib[argon2]>=0.3",
    "aiogram>=3.31",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
local-embeddings = ["fastembed>=0.9"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N", "PL"]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["app"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "fastembed.*", "saq.*", "docx.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
